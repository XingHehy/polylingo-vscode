name: Release VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.1 or v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Read release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must use X.Y.Z or vX.Y.Z format."
              exit 1
            fi

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$first_line" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
            tag="${BASH_REMATCH[1]}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Commit message does not start with a valid vX.Y.Z version. Skipping release."
          fi

      - name: Check out repository
        if: steps.release.outputs.should_release == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci

      - name: Verify release version
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::Commit version v${VERSION} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Package VSIX
        if: steps.release.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm run package
          test -f "release/poly-lingo-${VERSION}.vsix"

      - name: Build release notes
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          awk -v heading="## ${VERSION}" '
            $0 == heading { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { lines[++count] = $0 }
            END {
              first = 1
              while (first <= count && lines[first] ~ /^[[:space:]]*$/) first++
              while (count >= first && lines[count] ~ /^[[:space:]]*$/) count--
              for (i = first; i <= count; i++) print lines[i]
            }
          ' CHANGELOG.md > release/current-changelog.md

          if [[ ! -s release/current-changelog.md ]]; then
            echo "::error::CHANGELOG.md does not contain a ## ${VERSION} section."
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${GITHUB_SHA}" \
            --jq '.body' > release/generated-notes.md

          {
            cat release/current-changelog.md
            printf '\n\n'
            cat release/generated-notes.md
          } > release/release-notes.md

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          versioned_asset="release/poly-lingo-${VERSION}.vsix"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$versioned_asset" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --latest \
              --title "$TAG" \
              --notes-file release/release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "$versioned_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release/release-notes.md \
              --latest
          fi
